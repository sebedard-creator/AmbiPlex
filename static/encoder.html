<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbiPlex - Encodeur WLED Subtitles</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div><a href="/">AmbiPlex</a><h1>Encodeur WLED Subtitles</h1></div>
            <nav class="page-nav" aria-label="Navigation principale">
                <a href="/" class="btn">Retour à Plex</a>
                <a href="/remote" class="btn">Remote Play</a>
            </nav>
        </header>
        
        <div class="encoder-grid">
            <section class="section">
                <h2>Paramètres d'encodage</h2>
                <form id="encoderForm">
                    <div class="field">
                        <label for="video_path">Fichier vidéo</label>
                        <div class="file-picker">
                            <input type="text" id="video_path" placeholder="Aucun fichier" required readonly>
                            <button type="button" id="btn_browse">Parcourir...</button>
                        </div>
                    </div>
                    
                    <div class="field-row">
                        <div class="field">
                            <label for="leds_x">LED haut / bas</label>
                            <input type="number" id="leds_x" value="64" min="1" required>
                        </div>
                        <div class="field">
                            <label for="leds_y">LED gauche / droite</label>
                            <input type="number" id="leds_y" value="36" min="1" required>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label for="depth">
                            Profondeur de capture <span id="depth_val">8%</span>
                        </label>
                        <input type="range" id="depth" min="1" max="50" value="8" oninput="document.getElementById('depth_val').innerText = this.value + '%'">
                    </div>

                    <div class="field">
                        <label for="threads">
                            Threads FFmpeg <span id="threads_val">Auto (Max)</span>
                        </label>
                        <input type="range" id="threads" min="0" max="16" value="0" oninput="document.getElementById('threads_val').innerText = this.value == 0 ? 'Auto (Max)' : this.value + ' Threads'">
                    </div>

                    <button type="submit" id="btn_encode" class="btn-primary" disabled>Lancer l'encodage</button>
                </form>
            </section>

            <section class="section">
                <h2>Journal d'extraction</h2>
                <div id="encoder_console" class="encoder-console">En attente...</div>
            </section>
        </div>
    </main>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const btnBrowse = document.getElementById("btn_browse");
    const videoPathInput = document.getElementById("video_path");
    const btnEncode = document.getElementById("btn_encode");
    const encoderConsole = document.getElementById("encoder_console");
    const encoderForm = document.getElementById("encoderForm");
    
    // Auto-fill configuration
    fetch("/api/config?t=" + new Date().getTime(), { cache: "no-store" })
        .then(res => res.json())
        .then(data => {
            if (data.leds_top) document.getElementById("leds_x").value = data.leds_top;
            if (data.leds_side) document.getElementById("leds_y").value = data.leds_side;
            if (data.led_depth) {
                document.getElementById("depth").value = data.led_depth;
                document.getElementById("depth_val").innerText = data.led_depth + "%";
            }
        });

    btnBrowse.addEventListener("click", () => {
        btnBrowse.textContent = "...";
        fetch("/api/encoder/browse", { method: "POST" })
            .then(res => res.json())
            .then(data => {
                btnBrowse.textContent = "Parcourir...";
                if (data.path) {
                    // Extract filename from the path (handles both / and \)
                    const filename = data.path.split(/[/\\]/).pop();
                    
                    videoPathInput.value = filename + " sélectionné";
                    videoPathInput.dataset.fullPath = data.path; // Store full path for the backend
                    
                    if (data.exists) {
                        // Visual feedback for existing file
                        videoPathInput.value = filename + " (Fichier WLEDSUB existant !)";
                        videoPathInput.style.borderColor = "#fbbf24"; // Yellow alert
                        videoPathInput.style.color = "#fbbf24";
                        
                        btnEncode.disabled = false;
                        btnEncode.textContent = "Écraser (Ré-encoder)";
                    } else {
                        // Visual feedback for new file
                        videoPathInput.value = filename + " sélectionné";
                        videoPathInput.style.borderColor = "#10b981"; // Green accent
                        videoPathInput.style.color = "#10b981";
                        
                        btnEncode.disabled = false;
                        btnEncode.textContent = "Lancer l'Encodage";
                    }
                }
            })
            .catch(err => {
                btnBrowse.textContent = "Parcourir...";
                console.error(err);
            });
    });

    let eventSource = null;

    encoderForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const videoPath = videoPathInput.dataset.fullPath || videoPathInput.value;
        if (!videoPath) return;

        // Reset console
        encoderConsole.textContent = "";
        btnEncode.disabled = true;
        btnEncode.textContent = "Encodage en cours...";
        btnBrowse.disabled = true;
        
        const payload = {
            video_path: videoPath,
            leds_x: parseInt(document.getElementById("leds_x").value),
            leds_y: parseInt(document.getElementById("leds_y").value),
            depth: parseInt(document.getElementById("depth").value),
            threads: parseInt(document.getElementById("threads").value)
        };

        fetch("/api/encoder/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            if (data.status === "success") {
                // Connect to SSE stream
                if (eventSource) eventSource.close();
                eventSource = new EventSource("/api/encoder/stream");
                
                eventSource.onmessage = (event) => {
                    const msgData = JSON.parse(event.data);
                    
                    if (msgData.type === "log") {
                        // Normalize Windows newlines
                        let msg = msgData.message.replace(/\r\n/g, '\n');
                        
                        // Handle progress \r by finding the last \r and replacing current line
                        if (msg.includes('\r')) {
                            const lines = encoderConsole.textContent.split('\n');
                            const parts = msg.split('\r');
                            lines[lines.length - 1] = parts[parts.length - 1];
                            encoderConsole.textContent = lines.join('\n');
                        } else {
                            encoderConsole.textContent += msg;
                        }
                        encoderConsole.scrollTop = encoderConsole.scrollHeight;
                    }  
                    else if (msgData.type === "done") {
                        eventSource.close();
                        btnEncode.disabled = false;
                        btnBrowse.disabled = false;
                        btnEncode.textContent = "Lancer un autre Encodage";
                        encoderConsole.textContent += '\n\n' + msgData.message;
                        encoderConsole.scrollTop = encoderConsole.scrollHeight;
                    }
                };
                
                eventSource.onerror = () => {
                    eventSource.close();
                    btnEncode.disabled = false;
                    btnBrowse.disabled = false;
                    btnEncode.textContent = "Erreur (Réessayer)";
                };
            } else {
                alert("Erreur: " + data.message);
                btnEncode.disabled = false;
                btnBrowse.disabled = false;
                btnEncode.textContent = "Lancer l'Encodage";
            }
        });
    });
});
    </script>
</body>
</html>
